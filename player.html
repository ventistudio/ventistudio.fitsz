<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur | VentiStudio FiTsZ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #7b61ff; --secondary: #00d4ff; --dark-bg: #0a0e27; }
        html, body { font-family: 'Segoe UI', sans-serif; background: var(--dark-bg); color: #e0e0ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .player { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 2rem; width: 90%; max-width: 400px; text-align: center; }
        .player-display { width: 100%; height: 250px; background: linear-gradient(135deg, #7b61ff, #00d4ff); border-radius: 15px; margin-bottom: 2rem; display: flex; align-items: center; justify-content: center; font-size: 4rem; }
        .controls { display: flex; justify-content: center; gap: 1rem; margin-top: 2rem; }
        button { background: var(--primary); border: none; color: white; padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: 600; }
        button:hover { background: var(--secondary); }
    </style>
</head>
<body>
    <div class="player">
        <h2 style="margin-bottom:1rem;">🎵 Lecteur Musical</h2>
        <div class="player-display">🎵</div>
        <p>VentiStudio Streaming</p>
        <div class="controls">
            <button>⏮️ Précéd.</button>
            <button>▶️ Lecture</button>
            <button>⏯️ Suivant</button>
        </div>
    </div>
</body>
</html>

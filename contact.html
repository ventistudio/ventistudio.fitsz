<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | VentiStudio FiTsZ</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='80' fill='%237b61ff'>⚡</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #7b61ff;
            --secondary: #00d4ff;
            --dark-bg: #0a0e27;
            --dark-surface: #141829;
            --light-bg: #f8f9ff;
            --light-surface: #ffffff;
            --dark-text: #e0e0ff;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg: var(--dark-bg);
            --surface: var(--dark-surface);
            --text: var(--dark-text);
            --text-secondary: rgba(224, 224, 255, 0.7);
        }

        html, body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(123, 97, 255, 0.2);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #7b61ff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content {
            max-width: 800px;
            margin: 0 auto;
            padding: 8rem 2rem 4rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 2rem;
        }

        input, textarea {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(123, 97, 255, 0.3);
            border-radius: 8px;
            color: var(--text);
            margin-bottom: 1rem;
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">✨ VentiStudio</a>
            <ul style="list-style:none;display:flex;gap:2rem;">
                <li><a href="index.html" style="text-decoration:none;color:inherit;">Accueil</a></li>
                <li><a href="about.html" style="text-decoration:none;color:inherit;">À propos</a></li>
                <li><a href="contact.html" style="text-decoration:none;color:inherit;">Contact</a></li>
            </ul>
        </nav>
    </header>
    <div class="content">
        <h1>💬 Contactez-nous</h1>
        <div class="glass-card">
            <form id="contact-form">
                <input type="text" placeholder="Votre nom" required>
                <input type="email" placeholder="Votre email" required>
                <input type="text" placeholder="Sujet" required>
                <textarea placeholder="Votre message..." required></textarea>
                <button type="submit" class="btn-submit">Envoyer</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Merci pour votre message!');
            this.reset();
        });
    </script>
</body>
</html>

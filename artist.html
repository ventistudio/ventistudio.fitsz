<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artistes | VentiStudio FiTsZ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #7b61ff;
            --secondary: #00d4ff;
            --dark-bg: #0a0e27;
        }
        html, body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--dark-bg);
            color: #e0e0ff;
        }
        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(123, 97, 255, 0.2);
            padding: 1rem 2rem;
        }
        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 8rem 2rem 4rem;
        }
        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #7b61ff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }
        .artist-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
        }
        .artist-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
        }
        .artist-card:hover {
            background: rgba(123, 97, 255, 0.1);
            transform: translateY(-5px);
        }
        .artist-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #7b61ff, #00d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        .artist-info {
            padding: 1.5rem;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" style="font-size:1.5rem;font-weight:700;color:inherit;text-decoration:none;">✨ VentiStudio</a>
    </header>
    <div class="content">
        <h1>🎨 Nos Artistes</h1>
        <div class="artist-gallery">
            <div class="artist-card">
                <div class="artist-image">🎵</div>
                <div class="artist-info">
                    <h3 style="color:#00d4ff;margin-bottom:0.5rem;">Aoki Univers</h3>
                    <p style="color:rgba(224,224,255,0.7);">Production musicale</p>
                </div>
            </div>
            <div class="artist-card">
                <div class="artist-image">🎨</div>
                <div class="artist-info">
                    <h3 style="color:#00d4ff;margin-bottom:0.5rem;">FiTsZ Creative</h3>
                    <p style="color:rgba(224,224,255,0.7);">Art numérique</p>
                </div>
            </div>
            <div class="artist-card">
                <div class="artist-image">🎦</div>
                <div class="artist-info">
                    <h3 style="color:#00d4ff;margin-bottom:0.5rem;">Umaishi Visual</h3>
                    <p style="color:rgba(224,224,255,0.7);">Production video</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
